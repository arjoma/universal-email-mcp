# universal-email-mcp — local-mode configuration (example)
#
# Default location: ~/.config/universal-email-mcp/config.toml (Linux; the platform
# config directory elsewhere). Override with --config or the UEM_CONFIG variable.
#
# Passwords are NEVER written here. Each account either names an environment
# variable (password_env) or uses the OS keyring:
#   keyring set universal-email-mcp <account name or keyring_key>

[settings]
# Local mode may reach mail servers on private networks (LAN, containers).
allow_private_networks = true
connect_timeout = 15   # seconds
read_timeout = 60      # seconds

[policy]
read_only = false
# send_message:  off              the tool is not offered
#                draft            composes and keeps drafts, never sends
#                confirm          the user confirms every send (MCP elicitation);
#                                 a client that cannot elicit leaves a draft  [default]
#                confirm-external confirm unless every recipient is internal
#                on               no confirmation (explicit opt-in) - except for
#                                 look-alike recipients, which are always confirmed
send = "confirm"
allowed_recipient_domains = []        # empty = any domain (subdomains count)
max_recipients = 20
# Internal = your own identity addresses plus these whole domains. Listing a public
# provider here (gmail.com) would make every one of its users "internal".
internal_domains = []
max_sends_per_hour = 20               # per SMTP account, counted while the server runs
max_sends_per_day = 100

[limits]
max_results = 50                      # messages per tool call
max_body_chars = 20000                # characters of body text per call
max_message_bytes = 10485760          # larger messages are fetched partially
max_attachment_bytes = 2097152        # largest attachment get_attachment returns
max_accounts_per_call = 10
account_timeout = 30                  # seconds per account in a fan-out
max_headers_scanned = 2000            # headers per account for fuzzy search / contacts
max_batch_messages = 50               # messages per mark / move / delete call
max_send_bytes = 26214400             # largest message handed to SMTP (25 MiB)

[downloads]
# Local mode serves attachment download links from a listener on 127.0.0.1 (never
# another interface): http://127.0.0.1:<port>/a/<signed token>. The key is random per
# run, so links stop working when the server stops and after link_ttl.
enabled = true
port = 0                              # 0 = a random free port per run
link_ttl = 86400                      # seconds a link stays valid
max_download_bytes = 104857600        # largest decoded attachment streamed (100 MiB)

# ---------------------------------------------------------------- accounts
# kind: "imap" (default) or "pop3". server: a preset name (united-domains) or a
# host name (then 993/995/465 with implicit TLS). [accounts.imap|pop3|smtp]
# tables override single endpoints: host, port, tls = "tls" | "starttls".
# permissions: read, organize (mark_messages, move_messages, create_folder),
# delete (delete_messages: move to Trash, never permanent), drafts.
# A tool that no account allows (or read_only = true) is not offered at all.

[[accounts]]
name = "Work"
server = "united-domains"
username = "alice@example.com"
password_env = "UEM_WORK_PASSWORD"
permissions = ["read", "organize", "drafts"]
# move_messages(to="archive") files into the archive folder (role "archive"). The
# scheme is detected from its subfolders: "flat" (nothing below, also an EMPTY
# archive), "yearly" (Archive/2025) or "monthly" (Archive/2025/10 or Archive/2025-10).
# Set it per account to force one; missing year/month folders are created.
# archive_scheme = "auto"          # auto | flat | yearly | monthly (account-level key)

[[accounts]]
name = "Archive"
username = "alice"
# no password_env → OS keyring, key "Archive" (or set keyring_key = "...")
permissions = ["read"]
[accounts.imap]
host = "mail.example.net"
port = 143
tls = "starttls"
# Folder role overrides when detection (SPECIAL-USE flags, EN/DE names) fails.
# Roles: inbox, sent, drafts, trash, junk, archive.
[accounts.folders]
sent = "INBOX.Gesendet"

[[accounts]]
name = "Old POP"
kind = "pop3"
server = "mail.example.org"
username = "alice@example.org"
password_env = "UEM_OLDPOP_PASSWORD"
# tls_verify = false              # only for local test servers; prefer tls_ca_file
# tls_ca_file = "~/certs/my-ca.pem"

# ---------------------------------------------------------------- identities
# Sending: send = true lets send_message use the identity. It needs an SMTP account
# (account / smtp_account: its [accounts.smtp] table or the preset's SMTP server and
# credentials; 465 = implicit TLS, 587 with tls = "starttls") and a store_account
# with the "drafts" permission: a message is always saved as a draft first, the Sent
# copy goes there, and a declined or impossible confirmation leaves the draft.
# save_sent = auto (copy to Sent unless the SMTP server files it itself) | always | never
# file_replies = sent | thread_folder | both: when a reply's original is filed in a
#   folder of your own (not INBOX, not Archive), `both` also puts the copy there and
#   `thread_folder` only there (falls back to Sent when no such folder).
#
# Senders. save_draft writes drafts as one of these identities (an unknown sender
# is refused). account = SMTP transport and credentials plus the IMAP account that
# receives Drafts/Sent copies (override separately with smtp_account /
# store_account; an identity that only needs drafts can set store_account alone,
# without any SMTP server). The IMAP account needs the "drafts" permission.
# Several addresses (addresses = [...]) are recognised when replying: the one the
# original was sent to becomes the sender. Exactly one identity is the default; if
# none is marked, the first one is. The signature is appended after the text,
# below a "-- " separator line that the server adds.

[[identities]]
address = "alice@example.com"
display_name = "Alice Example"
account = "Work"
default = true
send = false                    # true: send_message may send as this identity
# save_sent = "auto"
# file_replies = "sent"
signature = """
Alice Example
Example Inc."""
