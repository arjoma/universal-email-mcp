name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported floor (requires-python) and the newest release.
        python-version: ["3.12", "3.14"]
    services:
      # Real IMAP server for the integration tests (tests/integration).
      # Any user name logs in with USER_PASSWORD. Pinned by digest.
      dovecot:
        image: dovecot/dovecot:2.4.5@sha256:c807be4fb5a97d9c3a90770569d3a6c4cbdcb36742ad41f90409cbd929166553
        env:
          USER_PASSWORD: uem-test-password
        ports:
          - 31993:31993
          - 31143:31143
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests

      - name: Type check
        run: uv run --locked basedpyright

      - name: Unit tests
        run: uv run --locked pytest -q -m "not integration"

      - name: Integration tests (Dovecot service)
        env:
          UEM_TEST_IMAP_HOST: 127.0.0.1
          UEM_TEST_IMAPS_PORT: "31993"
          UEM_TEST_STARTTLS_PORT: "31143"
          UEM_TEST_IMAP_PASSWORD: uem-test-password
          UEM_TEST_REQUIRE_INTEGRATION: "1"
        run: uv run --locked pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Audit locked dependencies (all extras)
        run: |
          uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --require-hashes --requirement /tmp/requirements.txt
