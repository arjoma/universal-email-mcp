name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported floor (requires-python) and the newest release.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # Docker Hub limits anonymous pulls per runner IP; pull through Google's public
      # mirror (falls back to Docker Hub for images it lacks). Images stay pinned by digest.
      - name: Use the Docker Hub mirror
        run: |
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json \
            | sudo tee /etc/docker/daemon.tmp >/dev/null
          sudo mv /etc/docker/daemon.tmp /etc/docker/daemon.json
          sudo systemctl restart docker

      # Real IMAP + POP3 server for the integration tests (tests/integration). Any
      # user name logs in with USER_PASSWORD. Pinned by digest; started here rather
      # than as a service container because POP3 needs a command-line option the
      # image's default command lacks (tests/dovecot.py: DOVECOT_COMMAND). Mail on
      # tmpfs: Dovecot fsyncs every write, which makes seeding ~100x slower on disk.
      - name: Start Dovecot
        run: |
          docker run -d --name dovecot --tmpfs /srv/vmail:rw,mode=1777 \
            -p 31993:31993 -p 31143:31143 -p 31995:31995 -p 31110:31110 \
            -e USER_PASSWORD=uem-test-password \
            dovecot/dovecot:2.4.5@sha256:c807be4fb5a97d9c3a90770569d3a6c4cbdcb36742ad41f90409cbd929166553 \
            /dovecot/sbin/dovecot -F -o 'protocols=imap pop3 submission lmtp sieve'

      - name: Lint
        run: |
          uv run --locked ruff check src tests scripts
          uv run --locked ruff format --check src tests scripts

      - name: Type check
        run: uv run --locked basedpyright

      - name: Unit tests
        run: uv run --locked pytest -q -m "not integration"

      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore -p 8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8080
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 2; done
          docker logs firestore; exit 1

      - name: Integration tests (Dovecot service, Firestore emulator)
        env:
          UEM_TEST_FIRESTORE_HOST: 127.0.0.1:8080
          UEM_TEST_IMAP_HOST: 127.0.0.1
          UEM_TEST_IMAPS_PORT: "31993"
          UEM_TEST_STARTTLS_PORT: "31143"
          UEM_TEST_POP3S_PORT: "31995"
          UEM_TEST_POP3_PORT: "31110"
          UEM_TEST_IMAP_PASSWORD: uem-test-password
          UEM_TEST_REQUIRE_INTEGRATION: "1"
        run: uv run --locked pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Audit locked dependencies (all extras)
        run: |
          uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --require-hashes --requirement /tmp/requirements.txt

  container:
    # The production image (with the Firestore client): builds, starts in OAuth mode with
    # the memory store, answers the platform probes and refuses /mcp without a token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker Hub limits anonymous pulls per runner IP; pull through Google's public
      # mirror (falls back to Docker Hub for images it lacks). Images stay pinned by digest.
      - name: Use the Docker Hub mirror
        run: |
          [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json \
            | sudo tee /etc/docker/daemon.tmp >/dev/null
          sudo mv /etc/docker/daemon.tmp /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Build image
        run: docker build --build-arg EXTRAS=gcp --build-arg REVISION="$GITHUB_SHA" --tag uem-ci:test .
      - name: Smoke test
        run: ENGINE=docker scripts/smoke_container.sh uem-ci:test
      - name: Scan image for vulnerabilities (Trivy)
        # Fixed HIGH/CRITICAL findings in the image fail the job; unfixed ones are
        # ignored. A new base-image CVE can turn this red without any code change:
        # rebuild with a newer digest pin (Dockerfile) rather than muting it.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uem-ci:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  deploy-files:
    # shellcheck of the deployment scripts; YAML, rendering and syntax checks are in
    # tests/test_deploy_files.py (run by the test job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck deploy/gcp/*.sh scripts/smoke_container.sh
