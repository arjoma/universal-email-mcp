name: Release

# Push a tag "vX.Y.Z" (equal to the version in pyproject.toml) to publish to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point at a commit on main"; exit 1; }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Tag must match pyproject.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(uv version --short)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: CHANGELOG must have an entry for this version
        env:
          TAG: ${{ github.ref_name }}
        run: grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "::error::No CHANGELOG.md entry for ${TAG#v}"; exit 1; }

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/universal-email-mcp/
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^(## )?\[/ {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: /tmp/notes.md
          files: dist/*
